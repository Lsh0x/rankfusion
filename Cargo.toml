[package]
name = "rankfusion"
version = "0.1.1"
edition = "2021"
rust-version = "1.71"
description = "Backend-agnostic rank aggregation, score fusion, and reranking for ranked candidate lists — RRF, weighted RRF, linear score fusion, composable reranking pipelines."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lsh0x/rankfusion"
documentation = "https://docs.rs/rankfusion"
readme = "README.md"
keywords = ["ranking", "rank-fusion", "rrf", "reranking", "search"]
categories = ["algorithms", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
ahash = { version = "0.8", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }

[features]
default = []
ahash = ["dep:ahash"]
eval = []
serde = ["dep:serde"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"
serde_json = "1.0"

[[bench]]
name = "fusion"
harness = false
